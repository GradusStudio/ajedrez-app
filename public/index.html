    <link rel="canonical" href="https://graduschess.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gradus" />
    <meta property="og:title" content="Gradus Chess: aprende ajedrez" />
    <meta property="og:description" content="Aprende ajedrez gratis con lecciones, aperturas, puzzles y bots con personalidad. Sin anuncios ni cuentas. Instálala como app en tu celular o computadora." />

    <meta property="og:image" content="https://graduschess.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gradus Chess",
        "alternateName": "Gradus",
        "url": "https://graduschess.com/",
        "description": "Aprende ajedrez gratis con lecciones, aperturas, puzzles y bots con personalidad.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["es", "en", "de", "it", "fr"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@type": "Organization", "name": "Gradus Studio", "email": "gradusstudioapp@gmail.com" }
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#262421" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gradus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // El idioma del documento sigue al del navegador (es, en, de, it, fr; si no, inglés).
      (function () {
        var l = String(navigator.language || 'es').slice(0, 2).toLowerCase();
        document.documentElement.lang = ['es', 'en', 'de', 'it', 'fr'].indexOf(l) >= 0 ? l : 'en';
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* La barra de desplazamiento sale oscura, como el tema (en la columna central se vería blanca). */
      html {
        color-scheme: dark;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #262421;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Foco visible con el teclado (react-native-web lo quita): dorado del tema, 8:1 o más sobre bg (9,6) y surface (8,4). */
      [tabindex]:focus-visible,
      a:focus-visible {
        outline: 3px solid #f7c631 !important;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>

    <div id="root"></div>

</html>
