<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#262421" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gradus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // El idioma del documento sigue al del navegador (es, en, de, it, fr; si no, inglés).
      (function () {
        var l = String(navigator.language || 'es').slice(0, 2).toLowerCase();
        document.documentElement.lang = ['es', 'en', 'de', 'it', 'fr'].indexOf(l) >= 0 ? l : 'en';
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #262421;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Foco visible con el teclado (react-native-web lo quita): dorado del tema, 4.9:1 o más sobre bg y surface. */
      [tabindex]:focus-visible,
      a:focus-visible {
        outline: 3px solid #f7c631 !important;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
